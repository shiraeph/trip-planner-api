spring.application.name=travel-planner-api

# Comma-separated CORS patterns for /api/**. Override in prod: env APP_CORS_ALLOWED_ORIGIN_PATTERNS (Spring maps to this property).
app.cors.allowed-origin-patterns=http://localhost:*,http://127.0.0.1:*,https://trip-planner-web-six.vercel.app
spring.mongodb.uri=${MONGO_URI}
spring.mongodb.auto-index-creation=true

openai.api.key=${OPENAI_API_KEY}
openai.model=gpt-4o
