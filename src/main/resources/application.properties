spring.application.name=travel-planner-api

# Comma-separated CORS patterns for /api/**. Override in prod: env APP_CORS_ALLOWED_ORIGIN_PATTERNS (Spring maps to this property).
app.cors.allowed-origin-patterns=http://localhost:*,http://127.0.0.1:*,https://trip-planner-web-six.vercel.app
spring.mongodb.uri=${MONGO_URI}
spring.mongodb.auto-index-creation=true

openai.api.key=${OPENAI_API_KEY}
openai.model=gpt-5.4-mini
# Bilingual itineraries need a large completion budget per API call.
openai.max-tokens=${OPENAI_MAX_TOKENS:32768}
# Trips longer than threshold are generated in multiple OpenAI calls (chunk-size days each).
trip.itinerary.chunk-threshold-days=${TRIP_CHUNK_THRESHOLD_DAYS:6}
# Smaller chunks avoid truncated bilingual JSON (more API calls for long trips).
trip.itinerary.chunk-size-days=${TRIP_CHUNK_SIZE_DAYS:3}
# EN-first planning + Hebrew translation pass (faster, less truncation). Set false for legacy bilingual single-pass.
trip.itinerary.split-languages=${TRIP_SPLIT_LANGUAGES:true}
# Optional faster model for Hebrew translation (defaults to openai.model). Try gpt-4o-mini for speed benchmarks.
openai.translation.model=${OPENAI_TRANSLATION_MODEL:${openai.model}}
